services:
  app:
    image: ghcr.io/nstamm/whatsapp-ia-yoga:latest
    container_name: whatsapp-ia-yoga
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: America/Argentina/Buenos_Aires
    labels:
      - traefik.enable=true
      - traefik.http.routers.whatsapp.rule=Host(`panel.ofiprof.com`)
      - traefik.http.routers.whatsapp.entrypoints=websecure
      - traefik.http.routers.whatsapp.tls=true
      - traefik.http.routers.whatsapp.tls.certresolver=letsencrypt
      - traefik.http.routers.whatsapp.service=whatsapp
      - traefik.http.services.whatsapp.loadbalancer.server.port=3000
      - traefik.http.routers.whatsapp-http.rule=Host(`panel.ofiprof.com`)
      - traefik.http.routers.whatsapp-http.entrypoints=web
      - traefik.http.routers.whatsapp-http.middlewares=redirect-to-https@docker
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
